<!--
  The tab icon: the series emblem, redrawn for 16 pixels.

  It is the same broken ring and overrunning plus as `SmashEmblem` in
  TitleScreen.tsx, with three changes that only matter at favicon size — a
  filled ground so the mark never sits on whatever colour the browser chrome
  happens to be, heavier strokes because a 9-unit stroke on a 100-unit box
  disappears below about 24px, and a shorter dash gap so the break in the ring
  still reads as a break rather than as a printing fault.

  A file here rather than in `public/`: this is the App Router's `icon`
  convention, so Next fingerprints it and emits the <link rel="icon"> itself.
  Without one, every page load ended in a 404 for /favicon.ico — which is also
  what made Next compile the Pages Router error entry, and with it a second
  copy of React, into an app that has no `pages/` directory at all.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="18" fill="#090b0c" />
  <circle
    cx="50"
    cy="50"
    r="32"
    fill="none"
    stroke="#f2f0eb"
    stroke-width="12"
    stroke-dasharray="150 28"
    stroke-dashoffset="20"
  />
  <g fill="#f2f0eb">
    <rect x="42" y="6" width="16" height="38" />
    <rect x="42" y="56" width="16" height="38" />
    <rect x="6" y="42" width="38" height="16" />
    <rect x="56" y="42" width="38" height="16" />
  </g>
  <circle cx="50" cy="50" r="14" fill="#ad0000" />
</svg>
