allowBuilds:
  unrs-resolver: true
  # wrangler bundles with esbuild and runs Workers locally in workerd; both
  # ship platform binaries through install scripts.
  esbuild: true
  workerd: true
  # sharp (one copy, 0.35.4: Next's, miniflare's, gltf-transform's and
  # scripts/models/glb.mjs's) ships prebuilt @img/* binaries; its install
  # script never needs to run.
  sharp: false
